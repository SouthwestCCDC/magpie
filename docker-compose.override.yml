# Magpie Artifact Storage - Local Development Overlay
#
# Compose merges this in automatically alongside docker-compose.yml
# (`docker compose up`/`build`, no -f needed) -- it is NOT a second,
# independent stack. Only the deltas needed for local iteration live
# here; everything else (hardening, fail-closed env) comes from the
# canonical operator file and is NOT relaxed here.
#
# To run the canonical file alone (e.g. to reproduce an operator
# deployment exactly), pass `-f docker-compose.yml` explicitly -- that
# disables Compose's automatic override-file merge.

services:
  magpie:
    # Build from source instead of pulling MAGPIE_IMAGE.
    build:
      context: .
      dockerfile: Dockerfile.bundled
    environment:
      # Dev convenience: a file-sink default so `docker compose up` works
      # without setting MAGPIE_ADMIN_TOKEN_SINK first (the canonical file
      # has no default -- fail-closed by design). Written into the
      # bind-mounted /data directory, readable on the host at
      # ${MAGPIE_DATA_DIR:-./data}/admin-token.
      - MAGPIE_ADMIN_TOKEN_SINK=${MAGPIE_ADMIN_TOKEN_SINK:-file}
      # Enables the /api/v1/_test/* memory-tracking endpoints used by the
      # e2e suite. NEVER set true in a real deployment.
      - MAGPIE_ENABLE_TEST_ENDPOINTS=${MAGPIE_ENABLE_TEST_ENDPOINTS:-false}
