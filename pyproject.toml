[project]
name = "magpie"
version = "0.1.3"
description = "Content-addressed artifact storage with mutable tags"
authors = [{ name = "SWCCDC Team" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]",
    "click>=8.3.3",
    "httpx",
    "pydantic-settings>=2.14.2",
    "aiofiles",
    "python-multipart>=0.0.30",
    "sentry-sdk[fastapi]",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp",
    "rich",
    "tomli_w",
    "structlog",
    "truststore>=0.8.0",
    "protobuf>=6.33.5,<7",
    "packaging",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
magpie = "magpie.cli:main"
magpie-ctl = "magpie.ctl:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest>=9.0.3",
    "pytest-asyncio",
    "pytest-cov",
    "bandit[toml]",
    "pre-commit",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: End-to-end tests requiring docker-compose",
    "slow: Slow tests that take significant time to run",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magpie"]
