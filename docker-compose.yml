# Magpie Artifact Storage - Docker Compose Configuration
#
# Services:
# - caddy: Reverse proxy and static file server (ports configurable via env vars)
# - magpie: FastAPI backend for API operations (internal port 8000)
#
# Volumes:
# - ${MAGPIE_DATA_DIR:-./data}: Shared storage for artifact blobs, symlinks, and database
# - caddy_data/caddy_config: Caddy's internal state and certificates
#
# Configuration:
# - MAGPIE_DATA_DIR: Host path for data directory (default: ./data)

services:
  # Caddy reverse proxy - handles routing and static file serving
  # Routes /api/v1/* and /health to magpie service
  # Serves /artifacts/* directly from storage for performance
  caddy:
    image: caddy:2-alpine
    ports:
      - "${MAGPIE_HTTP_PORT:-8080}:80"    # HTTP
      - "${MAGPIE_HTTPS_PORT:-8443}:443"  # HTTPS (auto-TLS in production)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MAGPIE_DATA_DIR:-./data}/artifacts:/data/artifacts:ro  # Read-only for static serving
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - MAGPIE_ALLOWED_CIDRS=${MAGPIE_ALLOWED_CIDRS:-}
    depends_on:
      - magpie
    restart: unless-stopped

  # Magpie FastAPI service - handles API requests
  # Manages artifact uploads, listing, and metadata
  magpie:
    build: .
    volumes:
      - ${MAGPIE_DATA_DIR:-./data}:/data  # Read-write for uploads and database
    environment:
      - MAGPIE_STORAGE_PATH=/data/artifacts
      - MAGPIE_DATABASE_PATH=${MAGPIE_DATABASE_PATH:-/data/magpie.db}
      - MAGPIE_DEBUG=${MAGPIE_DEBUG:-false}
      # Admin bootstrap token delivery (see docs/installation.md). Dev default
      # is sink=file, written into the same bind-mounted /data directory so
      # it's readable on the host at ${MAGPIE_DATA_DIR:-./data}/admin-token.
      - MAGPIE_ADMIN_TOKEN_SINK=${MAGPIE_ADMIN_TOKEN_SINK:-file}
      - MAGPIE_ADMIN_TOKEN_SINK_FILE_PATH=${MAGPIE_ADMIN_TOKEN_SINK_FILE_PATH:-/data/admin-token}
      - MAGPIE_ADMIN_TOKEN_SINK_EXEC_COMMAND=${MAGPIE_ADMIN_TOKEN_SINK_EXEC_COMMAND:-}
      - MAGPIE_ADMIN_TOKEN_SINK_EXEC_TIMEOUT_SECONDS=${MAGPIE_ADMIN_TOKEN_SINK_EXEC_TIMEOUT_SECONDS:-30}
      - MAGPIE_S3_BUCKET=${MAGPIE_S3_BUCKET:-}
      - MAGPIE_S3_PREFIX=${MAGPIE_S3_PREFIX:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
      - MAGPIE_SENTRY_DSN=${MAGPIE_SENTRY_DSN:-}
      - MAGPIE_SENTRY_TRACES_SAMPLE_RATE=${MAGPIE_SENTRY_TRACES_SAMPLE_RATE:-1.0}
      - MAGPIE_OTEL_ENABLED=${MAGPIE_OTEL_ENABLED:-false}
      - MAGPIE_OTEL_ENDPOINT=${MAGPIE_OTEL_ENDPOINT:-}
      - MAGPIE_OTEL_SERVICE_NAME=${MAGPIE_OTEL_SERVICE_NAME:-magpie}
      - MAGPIE_ENABLE_TEST_ENDPOINTS=${MAGPIE_ENABLE_TEST_ENDPOINTS:-false}
    expose:
      - "8000"  # Internal only - accessed via Caddy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
