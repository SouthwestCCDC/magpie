# Magpie Artifact Storage - Docker Compose Configuration
#
# Services:
# - caddy: Reverse proxy and static file server (port 8080/8443)
# - magpie: FastAPI backend for API operations (internal port 8000)
#
# Volumes:
# - ./data/artifacts: Shared storage for artifact blobs and symlinks
# - caddy_data/caddy_config: Caddy's internal state and certificates

services:
  # Caddy reverse proxy - handles routing and static file serving
  # Routes /api/v1/* and /health to magpie service
  # Serves /artifacts/* directly from storage for performance
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"    # HTTP
      - "8443:443"   # HTTPS (auto-TLS in production)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/artifacts:/data/artifacts:ro  # Read-only for static serving
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - magpie
    restart: unless-stopped

  # Magpie FastAPI service - handles API requests
  # Manages artifact uploads, listing, and metadata
  magpie:
    build: .
    volumes:
      - ./data/artifacts:/data/artifacts  # Read-write for uploads
    environment:
      - MAGPIE_STORAGE_PATH=/data/artifacts
      - MAGPIE_DEBUG=true
    expose:
      - "8000"  # Internal only - accessed via Caddy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
