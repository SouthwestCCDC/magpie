# Magpie Artifact Storage - Canonical Operator Docker Compose Configuration
#
# THE operator file: one service (`magpie`), running the bundled single-
# container image (Dockerfile.bundled -- Caddy + uvicorn supervised by
# tini/wrapper.sh, see issue #309's 2026-07-18 decision and #586/#587).
# Caddy is an implementation detail baked into the image; there is no
# operator-facing Caddyfile and no inter-container networking. This
# replaces the old docker-compose.yml (dev) / docker-compose.prod.yml
# (prod) split (#232): the split conflated TLS + hardening + fail-closed
# config + test-endpoints, and separately the installer only ever ran the
# dev file, so hardening (cap_drop/read_only) was never actually applied
# on real installs. Hardening and fail-closed config below are
# UNCONDITIONAL -- there is no "prod mode" toggle.
#
# TLS: the container serves plain HTTP on :8080 only (non-privileged, so
# Caddy can run non-root -- see issue #589). It does NOT terminate TLS.
# Front it with your own reverse proxy (nginx, another Caddy, a cloud
# load balancer, infra-deployment's outer Caddy, etc.) for TLS.
#
# Local development: see docker-compose.override.yml, which compose
# merges in automatically (`docker compose up`) -- it swaps the pulled
# image for a from-source build and relaxes a couple of dev-convenience
# defaults, without weakening any hardening below.
#
# Configuration (see .env.example for the full list):
# - MAGPIE_DATA_DIR: host path for the data directory (default: ./data)
# - MAGPIE_IMAGE: image ref to run (default: ghcr.io/southwestccdc/magpie:latest)
# - MAGPIE_HTTP_PORT: host port published for the container's :8080 (default: 8080)
# - MAGPIE_BIND_IP: host IP the published port binds to (default: 0.0.0.0,
#   all interfaces)
# - MAGPIE_ADMIN_TOKEN_SINK: REQUIRED, no default (fail-closed) -- see the
#   `environment:` block below for the sink options and why there's no
#   Compose-level default

services:
  magpie:
    image: ${MAGPIE_IMAGE:-ghcr.io/southwestccdc/magpie:latest}
    ports:
      - "${MAGPIE_BIND_IP:-0.0.0.0}:${MAGPIE_HTTP_PORT:-8080}:8080"
    volumes:
      - ${MAGPIE_DATA_DIR:-./data}:/data
    environment:
      - MAGPIE_STORAGE_PATH=/data/artifacts
      - MAGPIE_DATABASE_PATH=${MAGPIE_DATABASE_PATH:-/data/magpie.db}
      # IMPORTANT: debug mode is hardcoded off -- unconditionally, not just
      # a default. Enabling it exposes detailed error messages and stack
      # traces that could leak sensitive info.
      - MAGPIE_DEBUG=false
      # Admin bootstrap token delivery -- REQUIRED, no default (fail-closed
      # by design; see the "Deliberately NOT ${MAGPIE_ADMIN_TOKEN_SINK:?err}"
      # note below for why there's no Compose-level default or guard). One
      # of:
      #   file    - write a 0600 file at MAGPIE_ADMIN_TOKEN_SINK_FILE_PATH
      #   exec    - pipe the token via stdin to MAGPIE_ADMIN_TOKEN_SINK_EXEC_COMMAND
      #             (e.g. a `vault kv put ...` invocation)
      #   discard - retain no bootstrap token; mint one later via
      #             `docker compose exec magpie magpie-ctl token create --scope admin`
      #   stdout  - opt-in only; insecure, prints the token to container logs
      #
      # Deliberately NOT `${MAGPIE_ADMIN_TOKEN_SINK:?err}`: Compose
      # interpolates each file's `${...}` expressions independently before
      # merging, so a `:?` here would abort on an unset var even when
      # docker-compose.override.yml supplies a default for the same key --
      # the override's value never gets a chance to rescue it (verified
      # against a real `docker compose config`, not assumed). The blank
      # passthrough below still fails closed: MagpieSettings'
      # `env_ignore_empty=True` treats the resulting blank string the same
      # as unset, and deliver_admin_token() raises a clear, specific error
      # and refuses to start serving if the sink ends up unconfigured -- an
      # operator running this file bare (no override) with no
      # MAGPIE_ADMIN_TOKEN_SINK set gets a failed, non-zero-exit container
      # with that message in its logs, not a silently-running server.
      - MAGPIE_ADMIN_TOKEN_SINK=${MAGPIE_ADMIN_TOKEN_SINK}
      - MAGPIE_ADMIN_TOKEN_SINK_FILE_PATH=${MAGPIE_ADMIN_TOKEN_SINK_FILE_PATH:-/data/admin-token}
      - MAGPIE_ADMIN_TOKEN_SINK_EXEC_COMMAND=${MAGPIE_ADMIN_TOKEN_SINK_EXEC_COMMAND:-}
      - MAGPIE_ADMIN_TOKEN_SINK_EXEC_TIMEOUT_SECONDS=${MAGPIE_ADMIN_TOKEN_SINK_EXEC_TIMEOUT_SECONDS:-30}
      # IP allow-listing for read-only access without bearer tokens
      # (consumed by the bundled Caddy). Default: empty (disabled).
      # Example: MAGPIE_ALLOWED_CIDRS=10.0.0.0/8,192.168.1.0/24
      - MAGPIE_ALLOWED_CIDRS=${MAGPIE_ALLOWED_CIDRS:-}
      # Trusted proxy IPs/CIDRs whose X-Forwarded-For header the bundled
      # Caddy honors when determining the client IP used by
      # MAGPIE_ALLOWED_CIDRS above. Default: empty (trust no proxy; the
      # real connecting peer's IP is used). Only set this to the exact
      # upstream hop(s) if something sits in front of this container --
      # never a broad range. See issue #575.
      - MAGPIE_TRUSTED_PROXIES=${MAGPIE_TRUSTED_PROXIES:-}
      # Upload limits (optional; bytes, empty = unlimited)
      - MAGPIE_MAX_UPLOAD_SIZE=${MAGPIE_MAX_UPLOAD_SIZE:-}
      # Logging: "json" (default) or "console" for human-readable logs
      - MAGPIE_LOG_FORMAT=${MAGPIE_LOG_FORMAT:-json}
      # Artifact retention (days) for garbage collection
      - MAGPIE_RETENTION_DAYS=${MAGPIE_RETENTION_DAYS:-90}
      # Temporary file storage (optional; default: derived from MAGPIE_STORAGE_PATH)
      - MAGPIE_TEMP_PATH=${MAGPIE_TEMP_PATH:-}
      # S3/AWS configuration for `magpie-ctl sync` (optional)
      - MAGPIE_S3_BUCKET=${MAGPIE_S3_BUCKET:-}
      - MAGPIE_S3_PREFIX=${MAGPIE_S3_PREFIX:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
      # Observability (optional)
      - MAGPIE_SENTRY_DSN=${MAGPIE_SENTRY_DSN:-}
      - MAGPIE_SENTRY_TRACES_SAMPLE_RATE=${MAGPIE_SENTRY_TRACES_SAMPLE_RATE:-1.0}
      - MAGPIE_OTEL_ENABLED=${MAGPIE_OTEL_ENABLED:-false}
      - MAGPIE_OTEL_ENDPOINT=${MAGPIE_OTEL_ENDPOINT:-}
      - MAGPIE_OTEL_SERVICE_NAME=${MAGPIE_OTEL_SERVICE_NAME:-magpie}
    restart: unless-stopped
    # The image bakes in its own HEALTHCHECK (Dockerfile.bundled) -- checks
    # /health through Caddy, so it only passes once both processes are up.
    #
    # Hardening, UNCONDITIONAL -- this minimal capability set was derived
    # by testing real containers, not guessing (see issue #591):
    #   SETUID/SETGID - gosu's privilege drop (uvicorn and Caddy alike)
    #   CHOWN/DAC_OVERRIDE - first-boot ownership fixups on a foreign-owned
    #     bind mount (root creating/chowning /data/artifacts, the DB dir,
    #     and /var/lib/caddy on a fresh volume it doesn't yet own)
    # Deliberately NOT included: KILL (the whole supervisor tree runs as
    # one non-root uid as of #591, so tini's own signal forwarding needs
    # no capability), NET_BIND_SERVICE (Caddy binds :8080, not :80/:443),
    # FOWNER (not needed once /var/lib/caddy is already owned by the
    # target uid).
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    # Filesystem is read-only; every path the bundled image writes to at
    # runtime is called out explicitly below (verified against a real
    # container under this exact cap/read_only combination, not just
    # reasoned about from the Dockerfile):
    #   /data          - bind mount above (artifacts, database, admin-token)
    #   /run           - wrapper.sh's magpie-user uid:gid marker
    #   /tmp           - Python's tempfile default dir; load-bearing for
    #                    `magpie-ctl sync` (S3 backup), which does not pass
    #                    an explicit dir= and fails outright without this
    #   /var/lib/caddy - Caddy's autosave config + state (ephemeral; this
    #                    image has no TLS state to persist, see above)
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/lib/caddy
