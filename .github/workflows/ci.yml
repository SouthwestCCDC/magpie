name: CI

on:
  pull_request:
  push:
    branches: [main, default]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run ruff check
        run: just lint

      - name: Run ruff format check
        run: just fmt-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pytest with coverage
        run: just test-ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run bandit security scan
        run: just security

      - name: Export requirements for pip-audit
        run: uv export --frozen --no-hashes > requirements.txt

      - name: Run pip-audit dependency scan
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
          # Ignore CVE-2026-0994 in protobuf: DoS via ParseDict recursion bypass
          # No fix available yet (checked 2026-01-29)
          # Impact: Limited - magpie doesn't use protobuf.json_format.ParseDict
          # Protobuf is transitive via opentelemetry-exporter-otlp
          ignore-vulns: |
            CVE-2026-0994
