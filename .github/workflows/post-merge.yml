name: Post-Merge Tests

on:
  push:
    branches: [default]

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run full test suite including large performance tests
        run: uv run pytest tests/unit/ tests/integration/ -v --tb=short
        env:
          MAGPIE_SKIP_LARGE_TESTS: "0"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache/
            test-results.xml
          retention-days: 7

  test-extra-large:
    needs: [full-test-suite]
    runs-on: [self-hosted, linux, large-disk]
    if: github.repository == 'SouthwestCCDC/magpie'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run extra-large upload tests
        run: uv run pytest -m large_upload -v --tb=short
        env:
          MAGPIE_SKIP_LARGE_TESTS: "0"
