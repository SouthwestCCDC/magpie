name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      major: ${{ steps.rolling.outputs.major }}
      minor: ${{ steps.rolling.outputs.minor }}
      move_latest: ${{ steps.rolling.outputs.move_latest }}
      move_major: ${{ steps.rolling.outputs.move_major }}
      move_minor: ${{ steps.rolling.outputs.move_minor }}
    steps:
      - uses: actions/checkout@v6
        with:
          # All tags, so the rolling-tag guard can see every prior release.
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT

          # Check if prerelease (contains -, e.g., v1.0.0-rc1)
          if [[ "$TAG" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate pyproject.toml version matches tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Version mismatch! Tag: v$TAG_VERSION, pyproject.toml: $PYPROJECT_VERSION"
            echo "Please update pyproject.toml version to match the tag."
            exit 1
          fi

          echo "Version validated: $TAG_VERSION"

      - name: Decide which rolling tags move
        id: rolling
        run: |
          git tag -l 'v*' | scripts/release_tag_flags.sh "${GITHUB_REF#refs/tags/v}" | tee -a "$GITHUB_OUTPUT"

  build-and-push:
    # Publishes the bundled single-container image (Dockerfile.bundled,
    # Caddy + uvicorn under one supervisor) as THE magpie image, from
    # v0.2.0 on (#634; reverses the "Option B" record in #609):
    #   <version>, <version>-bundled  every release, RC and final
    #   <major>.<minor>, <major>, latest  stable only, and only when this
    #     is the highest stable release in that scope
    #     (scripts/release_tag_flags.sh), so a later hotfix on an older
    #     line can't move them backwards.
    # `-bundled` stays as an alias: the installer and rc1-rc3 compose/env
    # pins use it. The two-container image (./Dockerfile) is no longer
    # published -- nothing in 0.2.x consumes it (0.1.x -> 0.2.0 upgrades
    # run the 0.2.0 installer, which pulls -bundled). Removing the
    # Dockerfile itself is 0.3.0 work.
    name: Build and push container
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Every tag is spelled out below; never let metadata-action add
          # `latest` on its own.
          flavor: |
            latest=false
          # All `type=raw` from validate's outputs, not `type=semver`
          # patterns: metadata-action ignores `pattern` for prerelease refs
          # and emits the bare raw tag instead, which silently dropped the
          # `-bundled` suffix on RCs.
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=${{ needs.validate.outputs.version }}-bundled
            type=raw,value=${{ needs.validate.outputs.minor }},enable=${{ needs.validate.outputs.move_minor == 'true' }}
            type=raw,value=${{ needs.validate.outputs.major }},enable=${{ needs.validate.outputs.move_major == 'true' }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.move_latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bundled
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-and-push]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Update installer HARDCODED_VERSION
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          sed -i "s|^HARDCODED_VERSION=.*|HARDCODED_VERSION=\"$VERSION\"|" scripts/magpie-deploy.sh

          # Verify the update succeeded
          if ! grep -qF "HARDCODED_VERSION=\"$VERSION\"" scripts/magpie-deploy.sh; then
            echo "::error::Failed to update HARDCODED_VERSION in scripts/magpie-deploy.sh"
            exit 1
          fi

          echo "Updated HARDCODED_VERSION to $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.validate.outputs.version }}
          draft: false
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            scripts/magpie-deploy.sh
