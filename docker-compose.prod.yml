# Magpie Artifact Storage - Production Docker Compose Configuration
#
# Requires Docker Compose v2.1+ (for healthcheck 'condition' support)
#
# This configuration is intended for production deployments with:
# - TLS/HTTPS enabled via Caddyfile.prod
# - Security hardening settings
# - Production-ready health checks
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required Environment Variables:
#   MAGPIE_DOMAIN     - The domain name for TLS (REQUIRED - e.g., magpie.swccdc.com)
#   MAGPIE_DATA_DIR   - Host path for data directory (default: ./data)
#
# Optional Environment Variables:
#   MAGPIE_HTTP_PORT       - External HTTP port (default: 80)
#   MAGPIE_HTTPS_PORT      - External HTTPS port (default: 443)
#   MAGPIE_ALLOWED_CIDRS   - CIDR ranges allowed to bypass auth for reads (default: none)
#   MAGPIE_TRUSTED_PROXIES - IPs/CIDRs whose X-Forwarded-For is honored (default: none --
#                            trust no proxy). Only needed if Caddy sits behind another
#                            reverse proxy. See issue #575.
#   AUTHENTIK_HOST         - Authentik server hostname for SSO
#                            (e.g., authentik.example.com)
#                            See docs/authentik-setup.md for setup instructions
#
# TLS Configuration:
#   By default, Caddy uses Let's Encrypt for automatic TLS certificates.
#   For manual TLS certificates or testing:
#   1. Mount certificate files as volumes (see commented example below)
#   2. In Caddyfile.prod, add or uncomment a tls directive with the mounted paths
#      Example: tls /certs/cert.pem /certs/key.pem
#   For Let's Encrypt staging (testing): In Caddyfile.prod, add or uncomment a tls block:
#      tls {
#        ca https://acme-staging-v02.api.letsencrypt.org/directory
#      }
#   For self-signed certificates (testing): In Caddyfile.prod, add or uncomment: tls internal
#
# Note: For Let's Encrypt auto-TLS, ensure:
# - Port 443 is publicly accessible
# - MAGPIE_DOMAIN resolves to this server's IP
# - No other service is using port 443

services:
  # Caddy reverse proxy - handles TLS, routing, and static file serving
  # Uses Caddyfile.prod for production configuration
  caddy:
    image: caddy:2-alpine
    ports:
      - "${MAGPIE_HTTP_PORT:-80}:80"    # HTTP (redirects to HTTPS)
      - "${MAGPIE_HTTPS_PORT:-443}:443"  # HTTPS
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ${MAGPIE_DATA_DIR:-./data}/artifacts:/data/artifacts:ro
      - caddy_data:/data      # TLS certificates and state
      - caddy_config:/config  # Caddy configuration
      # Optional: Mount manual TLS certificates (requires editing Caddyfile.prod)
      # Uncomment the line below and edit Caddyfile.prod to use manual certificates:
      # - /path/to/certs:/certs:ro
    environment:
      # MAGPIE_DOMAIN is required - Let's Encrypt will fail without a valid domain
      - MAGPIE_DOMAIN=${MAGPIE_DOMAIN:?MAGPIE_DOMAIN must be set}
      # Optional: IP allow-listing for read-only access without bearer tokens.
      # The application's default for MAGPIE_ALLOWED_CIDRS is empty (disabled), but this
      # compose file sets 255.255.255.255/32 as a sentinel to keep Caddy's client_ip
      # matcher valid. The effective behavior is the same: no CIDR-based bypass.
      # To enable this feature, set one or more real CIDRs, e.g.:
      # MAGPIE_ALLOWED_CIDRS=10.0.0.0/8,192.168.1.0/24
      - MAGPIE_ALLOWED_CIDRS=${MAGPIE_ALLOWED_CIDRS:-255.255.255.255/32}
      # Trusted proxy IPs/CIDRs whose X-Forwarded-For header Caddy honors
      # when determining the client IP used by MAGPIE_ALLOWED_CIDRS above.
      # Default: empty (trust no proxy; the real connecting peer's IP is
      # used). Only set this to the exact upstream hop(s) if Caddy sits
      # behind another reverse proxy -- never a broad range. See
      # Caddyfile.prod and issue #575.
      - MAGPIE_TRUSTED_PROXIES=${MAGPIE_TRUSTED_PROXIES:-}
      # Optional: Authentik SSO integration for browser access to /artifacts/*
      # See docs/authentik-setup.md for setup instructions
      - AUTHENTIK_HOST=${AUTHENTIK_HOST:-}
    depends_on:
      magpie:
        condition: service_healthy
    restart: unless-stopped
    # Security: Run as non-root where possible (Caddy handles this internally)
    # Limit capabilities for security
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Required for binding to ports 80/443
    # Filesystem is read-only for security; writable paths use named volumes:
    # - /data (caddy_data): TLS certificates and Let's Encrypt state
    # - /config (caddy_config): Caddy runtime configuration
    read_only: true
    tmpfs:
      - /tmp

  # Magpie FastAPI service - handles API requests
  magpie:
    build: .
    volumes:
      - ${MAGPIE_DATA_DIR:-./data}:/data
    environment:
      - MAGPIE_STORAGE_PATH=/data/artifacts
      - MAGPIE_DATABASE_PATH=${MAGPIE_DATABASE_PATH:-/data/magpie.db}
      # IMPORTANT: Keep debug mode disabled in production. Enabling it exposes
      # detailed error messages and stack traces that could leak sensitive info.
      - MAGPIE_DEBUG=false
      # Admin bootstrap token delivery -- REQUIRED, no default (fail-closed by
      # design; see docs/installation.md "Admin Token Delivery"). Choose one of:
      #   file    - write a 0600 file at MAGPIE_ADMIN_TOKEN_SINK_FILE_PATH
      #   exec    - pipe the token via stdin to MAGPIE_ADMIN_TOKEN_SINK_EXEC_COMMAND
      #             (e.g. a `vault kv put ...` invocation)
      #   discard - retain no bootstrap token; mint one later via
      #             `docker compose ... exec magpie magpie-ctl token create --scope admin`
      #   stdout  - opt-in only; insecure, prints the token to container logs
      - MAGPIE_ADMIN_TOKEN_SINK=${MAGPIE_ADMIN_TOKEN_SINK:?MAGPIE_ADMIN_TOKEN_SINK must be set (file, exec, discard, or stdout) -- see docs/installation.md}
      - MAGPIE_ADMIN_TOKEN_SINK_FILE_PATH=${MAGPIE_ADMIN_TOKEN_SINK_FILE_PATH:-/data/admin-token}
      - MAGPIE_ADMIN_TOKEN_SINK_EXEC_COMMAND=${MAGPIE_ADMIN_TOKEN_SINK_EXEC_COMMAND:-}
      - MAGPIE_ADMIN_TOKEN_SINK_EXEC_TIMEOUT_SECONDS=${MAGPIE_ADMIN_TOKEN_SINK_EXEC_TIMEOUT_SECONDS:-30}
      # S3/AWS configuration for magpie-ctl sync command (optional)
      # Set these variables in your .env file to enable S3 backup functionality
      - MAGPIE_S3_BUCKET=${MAGPIE_S3_BUCKET:-}
      - MAGPIE_S3_PREFIX=${MAGPIE_S3_PREFIX:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
      # Upload limits (optional)
      # Set MAGPIE_MAX_UPLOAD_SIZE in bytes to limit upload size (default: unlimited)
      - MAGPIE_MAX_UPLOAD_SIZE=${MAGPIE_MAX_UPLOAD_SIZE:-}
      # Logging configuration (optional)
      # Set MAGPIE_LOG_FORMAT to "console" for human-readable logs (default: json)
      - MAGPIE_LOG_FORMAT=${MAGPIE_LOG_FORMAT:-json}
      # Artifact retention (optional)
      # Set MAGPIE_RETENTION_DAYS for garbage collection retention period (default: 90)
      - MAGPIE_RETENTION_DAYS=${MAGPIE_RETENTION_DAYS:-90}
      # Temporary file storage (optional)
      # Set MAGPIE_TEMP_PATH to override default temp directory (default: /data/artifacts/.tmp)
      - MAGPIE_TEMP_PATH=${MAGPIE_TEMP_PATH:-}
      # Observability configuration (optional)
      # Sentry error tracking - set MAGPIE_SENTRY_DSN in .env to enable
      - MAGPIE_SENTRY_DSN=${MAGPIE_SENTRY_DSN:-}
      - MAGPIE_SENTRY_TRACES_SAMPLE_RATE=${MAGPIE_SENTRY_TRACES_SAMPLE_RATE:-1.0}
      # OpenTelemetry - set MAGPIE_OTEL_ENABLED=true and MAGPIE_OTEL_ENDPOINT in .env to enable
      - MAGPIE_OTEL_ENABLED=${MAGPIE_OTEL_ENABLED:-false}
      - MAGPIE_OTEL_ENDPOINT=${MAGPIE_OTEL_ENDPOINT:-}
      - MAGPIE_OTEL_SERVICE_NAME=${MAGPIE_OTEL_SERVICE_NAME:-magpie}
    expose:
      - "8000"  # Internal only - accessed via Caddy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Security hardening: drop all capabilities, then add back only what the
    # entrypoint needs to write to the /data bind mount (owned by a non-root
    # host user), create directories, and drop privileges via gosu.  After
    # gosu switches to the target UID/GID these capabilities have no effect.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN         # Adjust directory ownership during init
      - DAC_OVERRIDE  # Write to /data bind mount owned by non-root host user
      - SETUID        # Required by gosu to switch UID
      - SETGID        # Required by gosu to switch GID
    # Filesystem is read-only for security; writable paths:
    # - /data: bind mount for artifact storage and database
    # - /run: tmpfs for entrypoint runtime files (magpie-user UID/GID marker)
    # - /tmp: tmpfs for temporary files
    read_only: true
    tmpfs:
      - /run
      - /tmp

volumes:
  caddy_data:
  caddy_config:
